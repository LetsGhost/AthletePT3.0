# Drittes Projekt auf dem Server: statische Website unter https://${ANALYTICS_DOMAIN}.
#   - athlete-analytics: nginx liefert die Dateien aus ./analytics-site aus (nicht im Git)
#
# Veröffentlicht keinen Port. Hängt im externen Netz "athletept-sports", über das der nginx-Proxy
# (docker-compose.proxy.yml, nginx/analytics.conf.template) ihn unter athlete-analytics:8080
# erreicht. Bewusst nicht in "athletept-proxy" (kein Zugriff auf die AthletePT-Container).
#
# Neue Version der Website: Dateien in ./analytics-site ersetzen, fertig (wird live gelesen).
# Start:
#   docker compose -f docker-compose.analytics.yml up -d

name: athletept-analytics

services:
  athlete-analytics:
    # Unprivilegiertes Image: nginx läuft nicht als root und lauscht deshalb auf 8080.
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: athlete-analytics
    volumes:
      - ./analytics-site:/usr/share/nginx/html:ro
      - ./nginx/analytics-site.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - sports

networks:
  sports:
    name: athletept-sports
    external: true
