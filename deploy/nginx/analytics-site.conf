# nginx im Container athlete-analytics: liefert nur statische Dateien aus.
# TLS und HSTS macht der Reverse-Proxy davor (nginx/analytics.conf.template).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Unbekannte Pfade auf index.html, damit auch eine Single-Page-App funktioniert.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
