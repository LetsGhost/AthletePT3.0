# Sicherheits-Header für die Web-App. In jeder location einbinden: nginx vererbt add_header nicht,
# sobald eine location eigene Header setzt.
#
# CSP: Die App lädt Skripte, Styles, Schriften und Bilder nur von der eigenen Origin und spricht
# nur die eigene API an. 'unsafe-inline' bei Styles, weil Radix (Dialoge) Style-Elemente einfügt.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Für ältere Browser ohne CSP frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
