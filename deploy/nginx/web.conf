# nginx im Web-Container: liefert nur die gebaute Web-App aus (Single-Page-App).
# TLS, HSTS und das Weiterleiten von /api an die API macht der Reverse-Proxy davor.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Healthcheck für Docker, ohne Log-Einträge.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Gehören zur API und dürfen nie die App ausliefern. Kommen sie hier an, stimmt das Routing
    # im Reverse-Proxy nicht.
    location /api/ {
        return 404;
    }

    # Dateinamen enthalten einen Hash: dürfen dauerhaft im Cache bleiben.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Web-App-Manifest (PWA). Die Endung fehlt in der mime.types von nginx; ein `types`-Block würde
    # die ganze Tabelle ersetzen, deshalb default_type nur hier.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Service Worker (/sw.js) fällt unter die Regel unten: nie cachen, sonst sieht der Browser
    # neue Versionen erst verspätet.
    # Alle anderen Pfade sind Routen der App (z. B. /plan/…): index.html ausliefern, nie cachen,
    # damit nach einem Deployment sofort die neue Version lädt.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
